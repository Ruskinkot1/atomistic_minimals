[project]
name = "curvature-fidelity"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "ase", "pandas", "matplotlib"]

[project.optional-dependencies]
models = ["torch", "mace-torch", "chgnet", "matgl"]
phonons = ["phonopy"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
